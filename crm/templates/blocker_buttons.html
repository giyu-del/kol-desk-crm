<form method="post" action="{% url 'add_blocker' %}" class="issue-grid">{% csrf_token %}{% if profile %}<input type="hidden" name="profile" value="{{ profile.pk }}">{% else %}<input name="link" placeholder="Affected link (optional)" aria-label="Affected link">{% endif %}{% for issue in issues %}<button class="outline" name="issue" value="{{ issue }}">{{ issue }}</button>{% endfor %}</form>
