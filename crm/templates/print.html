{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shift Report</title><link rel="stylesheet" href="{% static 'style.css' %}"><script defer src="{% static 'app.js' %}"></script></head><body><main class="content"><h1>{% if saved %}End-of-day report{% else %}Draft shift report{% endif %}</h1><button type="button" id="print">Print / Save PDF</button><dl class="report-grid">{% for label,value in data.items %}<dt>{{ label }}</dt><dd>{{ value }}</dd>{% endfor %}</dl>{% if saved.note %}<p>{{ saved.note }}</p>{% endif %}</main></body></html>
