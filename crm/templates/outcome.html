<form method="post" action="{% url 'record' profile.pk %}" class="inline form-row">{% csrf_token %}<label>Outcome<select name="outcome">{% for option in outcomes %}<option>{{ option }}</option>{% endfor %}</select></label><label>Channel<input name="channel" value="{{ channel|default:profile.platform }}"></label><label>Next follow-up<input name="followup" type="datetime-local"></label><label>Note<input name="notes"></label><button>Save outcome</button></form>
