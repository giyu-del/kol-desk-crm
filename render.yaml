services:
  - type: web
    name: kol-desk-crm
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn crm.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kol-desk-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.12
databases:
  - name: kol-desk-db
    plan: 0.1c-256mb
    databaseName: kol_desk
    user: kol_desk
    ipAllowList: []
