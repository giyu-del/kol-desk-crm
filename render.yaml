services:
  - type: web
    name: kol-desk-crm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py shell -c 'import os, pyotp; from django.contrib.auth import get_user_model; from django.db import transaction; from crm.models import Member; U = get_user_model(); password = os.getenv("CRM_ADMIN_PASSWORD"); secret = os.getenv("CRM_ADMIN_TOTP_SECRET"); code = pyotp.TOTP(secret).now() if secret else None; exec("with transaction.atomic():\n if password and code and not U.objects.filter(is_superuser=True).exists():\n  user = U.objects.create_superuser(username=\"admin\", password=password)\n  Member.objects.create(user=user, otp_secret=secret)")' &&
      gunicorn crm.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kol-desk-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: CRM_ADMIN_PASSWORD
        sync: false
      - key: CRM_ADMIN_TOTP_SECRET
        sync: false

databases:
  - name: kol-desk-db
    plan: free
    databaseName: kol_desk
    user: kol_desk
    ipAllowList: []
